<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Julia Ortiz Luis National High School</title>
    <meta
      name="description"
      content="Official website of Julia Ortiz Luis National High School — Quality Education, Inclusive Learning, Community Excellence."
    />
    <link rel="icon" type="image/png" href="/images/logo-jolnhs.png" />
    <link rel="apple-touch-icon" href="/images/logo-jolnhs.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#1C3E7C" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#081120" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Julia Ortiz Luis National High School" />
    <meta property="og:title" content="Julia Ortiz Luis National High School" />
    <meta
      property="og:description"
      content="Official website of Julia Ortiz Luis National High School — Quality Education, Inclusive Learning, Community Excellence."
    />
    <meta property="og:url" content="https://jolnhs-website.vercel.app/" />
    <meta
      property="og:image"
      content="https://jolnhs-website.vercel.app/images/site/hero-poster.webp"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://jolnhs-website.vercel.app/images/site/hero-poster.webp"
    />
    <!-- Applies the saved/OS theme before first paint — without this, a
         dark-mode visitor sees a full light flash on every navigation. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("jolnhs-theme");
          if (t === "light") t = "white"; // pre-sky choice
          var root = document.documentElement;
          if (t === "dark" || (t !== "white" && t !== "sky" && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            root.classList.add("dark");
          } else if (t === "sky") {
            root.classList.add("theme-sky");
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-background text-text-primary font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
